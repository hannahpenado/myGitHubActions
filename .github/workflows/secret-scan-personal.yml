# Secret scanning test workflow for a PERSONAL GitHub account.
# Uses gitleaks/gitleaks-action, which needs no GITLEAKS_LICENSE on personal
# accounts. Organization repos (City-of-Flagstaff-IT) require a license key
# for this action. Use secret-scan.yml there instead.
#
# Place at .github/workflows/secret-scan-personal.yml and .gitleaks.toml at
# the repo root.

name: Secret scan (personal test)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # lets the action comment on PR lines with findings

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so old commits are scanned too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Keep the results file off the run. It is downloadable by anyone
          # who can see the repo's Actions tab.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
