# Secret scanning and Python linting workflow for a PERSONAL GitHub account.
# Uses gitleaks/gitleaks-action, which needs no GITLEAKS_LICENSE on personal
# accounts. Organization repos (City-of-Flagstaff-IT) require a license key
# for this action. Use secret-scan.yml there instead.
#
# Place at .github/workflows/secret-scan-personal.yml, and put .gitleaks.toml
# and ruff.toml at the repo root.

name: Secret scan and lint (personal test)

on:
  push:
  pull_request:
  workflow_dispatch:

# Default for every job. Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lets the action comment on PR lines with findings
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so old commits are scanned too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Keep the results file off the run. It is downloadable by anyone
          # who can see the repo's Actions tab.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  # Lints Python, ArcPy scripts, Python toolboxes (.pyt), and notebooks.
  # Ruff reads the code without importing it, so arcpy does not need to be
  # installed on the runner (it cannot be: arcpy ships only with ArcGIS Pro
  # and ArcGIS Server, which are licensed Windows installs).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # matches the ArcGIS Pro 3.x Python

      - name: Install Ruff
        # Pinned so a new Ruff release cannot start failing old code.
        # Bump it on purpose and fix any new findings in the same commit.
        run: pip install "ruff==0.17.3"

      - name: Lint Python and ArcPy code
        # --output-format=github shows each finding inline on the PR diff.
        run: ruff check --output-format=github .

      - name: Check formatting
        # Reports files that Ruff would reformat. It does not change them.
        # Remove this step if you do not want to enforce one code style.
        run: ruff format --check --diff .
        continue-on-error: true   # warn only; delete this line to enforce
