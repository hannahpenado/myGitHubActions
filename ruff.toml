# Ruff lint configuration for City of Flagstaff GIS repositories.
# Tuned for ArcPy scripts, script tools, Python toolboxes (.pyt), and
# ArcGIS Notebooks (.ipynb). Place at the repo root next to .gitleaks.toml.

# ArcGIS Pro 3.x runs Python 3.11.
target-version = "py311"

# GIS code has long workspace paths, SQL where clauses, and field lists.
line-length = 120

# Python toolboxes are plain Python with a .pyt extension. Ruff skips them
# unless told to include them.
extend-include = ["*.pyt"]

# Folders that hold data or generated files, not source code.
extend-exclude = [
    "*.gdb",
    "*.aprx",
    "scratch",
    "Index",
    "ImportLog",
    "GpMessages",
    ".backups",
]

