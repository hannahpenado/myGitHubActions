[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports and variables
    "B",    # bugbear: likely bugs, such as mutable default arguments
    "PLE",  # pylint errors
    "SIM",  # simplifications
]

ignore = [
    # Esri samples and most ArcPy code use "from arcpy.sa import *", so the
    # wildcard import itself is allowed. F405 stays on: in a file with a
    # wildcard import, a typo like "totl" is reported as F405, not as an
    # undefined name, so ignoring F405 would hide real bugs. The arcpy.sa and
    # arcpy.ia names are listed under "builtins" at the bottom of this file,
    # so F405 fires only for names that are not ArcPy functions.
    "F403",
    # ArcPy scripts check out an extension before importing it:
    #     arcpy.CheckOutExtension("Spatial")
    #     from arcpy.sa import *
    # E402 flags that second import as "not at top of file".
    "E402",
    # Long lines are reported by the formatter check instead.
    "E501",
    # Nested "with arcpy.da.*Cursor" blocks are often clearer than one
    # combined with statement.
    "SIM117",
]

[lint.per-file-ignores]
# Python toolboxes must use Esri's method names and signatures
# (getParameterInfo, updateParameters, execute(self, parameters, messages)).
# These ignores matter only if you later add the N or ARG rule sets above.
"*.pyt" = ["N802", "N803", "ARG002"]
# Notebooks often import partway down, after markdown cells.
"*.ipynb" = ["E402"]

[lint.pyflakes]
# Do not report "import arcpy" or "import arcgis" as unused. Some modules
# import them only to confirm ArcGIS Pro is present or to check a license.
allowed-unused-imports = ["arcpy", "arcgis"]

[format]
quote-style = "double"

